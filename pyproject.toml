[project]
name = "eventhorizon"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.22",
  "scipy>=1.9",
  "matplotlib>=3.5",
  "pandas>=1.4",
  "sympy>=1.10",
  "rich>=12.0",
  "pyfiglet>=0.8",]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
# The package is not installed (tool.uv.package = false), so put the repo root on sys.path.
pythonpath = ["."]
# Only collect the real suite; scripts/dev/ holds exploratory scripts (one calls sys.exit).
testpaths = ["tests"]
# Face-on (inclination 0) evaluates tan(theta_0)**-2 = inf inside the lambdified eq.13; numpy warns, the result is correct.
filterwarnings = ["ignore:divide by zero encountered in scalar power:RuntimeWarning"]
